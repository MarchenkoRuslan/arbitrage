[project]
name = "arbitrage"
version = "0.1.0"
description = "DEX funding rate arbitrage screener"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
]

[project.scripts]
arbitrage = "src.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100
